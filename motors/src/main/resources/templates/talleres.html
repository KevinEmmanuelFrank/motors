<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Talleres</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 2rem; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ccc; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f0f0f0; }
        .actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.4rem 0.75rem; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; text-decoration: none; color: white; }
        .btn-detalle { background-color: #3498db; }
        .btn-editar { background-color: #f39c12; }
        .btn-eliminar { background-color: #e74c3c; }
        .btn-crear { background-color: #27ae60; }
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
        /* Estilos para el formulario de búsqueda */
        .search-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .search-form { display: flex; align-items: center; gap: 0.5rem; margin: 0; }
        .search-input { padding: 0.5rem; width: 300px; border-radius: 8px; border: 1px solid #ccc; }
        .search-button { background-color: #2980b9; }
    </style>
</head>
<body>
<div class="container">
    <h1>Lista de Talleres Mecánicos</h1>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="search-container">
        <span></span> <a href="/talleres/crear" class="btn btn-crear">+ Crear Taller</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre Taller</th>
            <th>Responsable</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(talleres)}">
            <td colspan="6" style="text-align: center; padding: 1rem;">No hay talleres registrados.</td>
        </tr>
        <tr th:each="taller : ${talleres}">
            <td th:text="${taller.id}"></td>
            <td th:text="${taller.nombreTaller}"></td> <td th:text="${taller.nombre + ' ' + taller.apellido}"></td>
            <td th:text="${taller.telefono}"></td>
            <td th:text="${taller.email}"></td>
            <td class="actions">
                <a th:href="@{'/talleres/' + ${taller.id}}" class="btn btn-detalle">Ver</a>
                <a th:href="@{'/talleres/editar/' + ${taller.id}}" class="btn btn-editar">Editar</a>
                <form th:action="@{'/talleres/borrar/' + ${taller.id}}" method="post" style="display:inline;"
                      onsubmit="return confirmarEliminacion();">
                    <button type="submit" class="btn btn-eliminar">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function confirmarEliminacion() {
        return confirm("¿Estás seguro de que deseas eliminar este taller?");
    }
    // Script para ocultar mensajes flash después de unos segundos
    window.addEventListener('DOMContentLoaded', () => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            if (alert) {
                setTimeout(() => {
                    alert.style.transition = "opacity 0.5s ease";
                    alert.style.opacity = 0;
                    setTimeout(() => alert.remove(), 500);
                }, 4000); // 4 segundos
            }
        });
    });
</script>
</body>
</html>
