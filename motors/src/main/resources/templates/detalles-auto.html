<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle del Auto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-xh6r+xRcjXY+1wGmQoA1Fephf7vLJxATuZzWqUj4j6DzQYbAQKxIqX4y38YBZwE9kZgW7EO2bGoSc6GMh6n4sA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            padding: 2rem;
        }

        .card {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 2rem;
        }

        .info {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #ddd;
        }

        .info:last-child {
            border-bottom: none;
        }

        .icon {
            width: 30px;
            margin-right: 15px;
            color: #3498db;
            text-align: center;
        }

        .label {
            font-weight: bold;
            color: #333;
            width: 200px;
        }

        .value {
            color: #555;
        }

        .buttons {
            text-align: center;
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            color: white;
            transition: background-color 0.3s ease;
        }

        .btn-back {
            background-color: #7f8c8d;
        }

        .btn-back:hover {
            background-color: #636e72;
        }

        .btn-edit {
            background-color: #3498db;
        }

        .btn-edit:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<div class="card">
    <h1><i class="fas fa-car-side"></i> Detalles del Auto</h1>

    <div class="info"><div class="icon"><i class="fas fa-hashtag"></i></div><div class="label">ID:</div><div class="value" th:text="${auto.id}">ID</div></div>
    <div class="info"><div class="icon"><i class="fas fa-industry"></i></div><div class="label">Marca:</div><div class="value" th:text="${auto.marca}">Marca</div></div>
    <div class="info"><div class="icon"><i class="fas fa-car"></i></div><div class="label">Modelo:</div><div class="value" th:text="${auto.modelo}">Modelo</div></div>
    <div class="info"><div class="icon"><i class="fas fa-palette"></i></div><div class="label">Color:</div><div class="value" th:text="${auto.color}">Color</div></div>
    <div class="info"><div class="icon"><i class="fas fa-calendar-alt"></i></div><div class="label">Año:</div><div class="value" th:text="${auto.anio}">Año</div></div>
    <div class="info"><div class="icon"><i class="fas fa-id-card"></i></div><div class="label">Cédula:</div><div class="value" th:text="${auto.cedula}">Cédula</div></div>
    <div class="info"><div class="icon"><i class="fas fa-tags"></i></div><div class="label">En venta:</div><div class="value" th:text="${auto.enVenta ? 'Sí' : 'No'}">Sí/No</div></div>
    <div class="info"><div class="icon"><i class="fas fa-road"></i></div><div class="label">0 KM:</div><div class="value" th:text="${auto.oKm ? 'Sí' : 'No'}">Sí/No</div></div>
    <div class="info"><div class="icon"><i class="fas fa-tachometer-alt"></i></div><div class="label">Kilómetros:</div><div class="value" th:text="${auto.kilometros}">Km</div></div>
    <div class="info"><div class="icon"><i class="fas fa-align-left"></i></div><div class="label">Descripción:</div><div class="value" th:text="${auto.descripcion}">Descripción</div></div>
    <div class="info"><div class="icon"><i class="fas fa-dollar-sign"></i></div><div class="label">Precio de entrada:</div><div class="value" th:text="${auto.precioEntrada}">0.00</div></div>
    <div class="info"><div class="icon"><i class="fas fa-receipt"></i></div><div class="label">Con gastos:</div><div class="value" th:text="${auto.precioEntradaConGastos}">0.00</div></div>
    <div class="info"><div class="icon"><i class="fas fa-cash-register"></i></div><div class="label">Precio de salida:</div><div class="value" th:text="${auto.precioSalida}">0.00</div></div>
    <div class="info"><div class="icon"><i class="fas fa-cogs"></i></div><div class="label">Transmisión:</div><div class="value" th:text="${auto.transmision}">Tipo</div></div>
    <div class="info"><div class="icon"><i class="fas fa-door-open"></i></div><div class="label">Puertas:</div><div class="value" th:text="${auto.puertas}">Puertas</div></div>
    <div class="info"><div class="icon"><i class="fas fa-gas-pump"></i></div><div class="label">Combustible:</div><div class="value" th:text="${auto.combustible}">Combustible</div></div>

    <div class="buttons">
        <a class="btn btn-back" th:href="@{/autos}"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-edit" th:href="@{'/autos/editar/' + ${auto.id}}"><i class="fas fa-pen"></i> Editar</a>
    </div>
</div>
</body>
</html>
