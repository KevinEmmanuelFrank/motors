<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Taller</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; color: #333; padding: 2rem; }
        .container { max-width: 700px; margin: auto; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        form { display: grid; gap: 1.2rem; /* Aumentado el espacio */ }
        label { font-weight: bold; margin-bottom: -0.5rem; /* Ajuste para acercar al input */ }
        input[type="text"], input[type="email"], input[type="number"], textarea { padding: 0.7rem; border-radius: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; /* Asegura que padding no aumente el ancho */ }
        textarea { resize: vertical; min-height: 80px; }
        .button-group { display: flex; gap: 1rem; margin-top: 1rem; justify-content: center; /* Centrar botones */ }
        .btn { padding: 0.75rem 1.5rem; border-radius: 10px; cursor: pointer; font-size: 1rem; color: white; border: none; text-decoration: none; text-align: center; font-family: sans-serif; }
        .btn-submit { background-color: #2c3e50; }
        .btn-submit:hover { background-color: #1a242f; }
        .btn-cancel { background-color: #e74c3c; }
        .btn-cancel:hover { background-color: #c0392b; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Crear Nuevo Taller</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/talleres/crear}" th:object="${taller}" method="post">

        <label for="nombreTaller">Nombre del Taller:</label>
        <input type="text" id="nombreTaller" th:field="*{nombreTaller}" required/>

        <label for="nombre">Nombre del Responsable:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required/>

        <label for="apellido">Apellido del Responsable:</label>
        <input type="text" id="apellido" th:field="*{apellido}" required/>

        <label for="domicilio">Domicilio:</label>
        <input type="text" id="domicilio" th:field="*{domicilio}" required/>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required/>

        <label for="telefono">Teléfono:</label>
        <input type="number" id="telefono" th:field="*{telefono}" required/> <label for="banco">Banco (Opcional):</label>
        <input type="text" id="banco" th:field="*{banco}" />

        <label for="descripcion">Descripción (Opcional):</label>
        <textarea id="descripcion" th:field="*{descripcion}"></textarea>

        <div class="button-group">
            <button class="btn btn-submit" type="submit">Crear Taller</button>
            <a href="/talleres" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
