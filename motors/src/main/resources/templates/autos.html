<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Autos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.4rem 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-detalle {
            background-color: #3498db;
            color: white;
        }

        .btn-editar {
            background-color: #f39c12;
            color: white;
        }

        .btn-eliminar {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lista de Autos</h1>
    <!-- Contenedor Flex -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">

        <!-- Formulario de Búsqueda -->
        <form th:action="@{/autos}" method="get" style="display: flex; align-items: center; gap: 0.5rem; margin: 0;">
            <input type="text" name="filtro" placeholder="Buscar por marca o modelo"
                   th:value="${filtro}" style="padding: 0.5rem; width: 300px; border-radius: 8px; border: 1px solid #ccc;">
            <button type="submit" class="btn btn-detalle" style="background-color: #2980b9;">Buscar</button>
        </form>

        <!-- Botón de Crear Auto -->
        <a href="/autos/crear" class="btn btn-detalle" style="background-color: #27ae60;">+ Crear Auto</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Color</th>
            <th>Kilómetros</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(autos)}">
            <td colspan="6" style="text-align: center; padding: 1rem;">No se encontraron autos con ese criterio.</td>
        </tr>
        <tr th:each="auto : ${autos}">
            <td th:text="${auto.id}"></td>
            <td th:text="${auto.marca}"></td>
            <td th:text="${auto.modelo}"></td>
            <td th:text="${auto.color}"></td>
            <td th:text="${auto.kilometros}"></td>
            <td class="actions">
                <a th:href="@{'/autos/' + ${auto.id}}" class="btn btn-detalle">Ver</a>
                <a th:href="@{'/autos/editar/' + ${auto.id}}" class="btn btn-editar">Editar</a>
                <form th:action="@{'/autos/' + ${auto.id}}" method="post" style="display:inline;"
                      onsubmit="return confirmarEliminacion();">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-eliminar">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Confirmación antes de eliminar -->
<script>
    function confirmarEliminacion() {
        return confirm("¿Estás seguro de que deseas eliminar este auto?");
    }
</script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const mensajeDiv = document.getElementById('mensaje-exito');
        if (mensajeDiv) {
            setTimeout(() => {
                mensajeDiv.style.transition = "opacity 0.5s ease";
                mensajeDiv.style.opacity = 0;
                setTimeout(() => mensajeDiv.remove(), 500);
            }, 3000);
        }
    });
</script>
</body>
</html>
