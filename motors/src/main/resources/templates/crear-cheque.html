<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${pageTitle}" class="mb-4"></h1>
    <p th:text="${cheque}">Cheque no está en el modelo</p>
    <form th:action="@{/cheques/guardar}" th:object="${cheque}" method="POST">
        <div class="form-group">
            <label for="fechaEmision">Fecha de Emisión:</label>
            <input type="date" class="form-control" id="fechaEmision" th:field="*{fechaEmision}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('fechaEmision')}" th:errors="*{fechaEmision}"></div>
        </div>

        <div class="form-group">
            <label for="idCliente">Destinatario:</label>
            <input type="text" class="form-control" id="idCliente" th:field="*{idCliente}" required maxlength="200">
            <div class="text-danger" th:if="${#fields.hasErrors('idCliente')}" th:errors="*{idCliente}"></div>
        </div>

        <div class="form-group">
            <label for="importe">Importe:</label>
            <input type="number" step="0.01" class="form-control" id="importe" th:field="*{importe}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}"></div>
        </div>

        <div class="form-group">
            <label for="banco">Banco:</label>
            <input type="text" class="form-control" id="banco" th:field="*{banco}" required maxlength="100">
            <div class="text-danger" th:if="${#fields.hasErrors('banco')}" th:errors="*{banco}"></div>
        </div>

        <div class="form-group">
            <label for="fechaVencimiento">Fecha de Vencimiento:</label>
            <input type="date" class="form-control" id="fechaVencimiento" th:field="*{fechaVencimiento}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></div>
        </div>

        <div class="form-group">
            <label for="fechaDeposito">Fecha de Depósito:</label>
            <input type="date" class="form-control" id="fechaDeposito" th:field="*{fechaDeposito}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('fechaDeposito')}" th:errors="*{fechaDeposito}"></div>
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>
            <select class="form-control" id="estado" th:field="*{estado}" required>
                <option value="">Seleccionar Estado</option>
                <option th:each="estado : ${estadosCheque}"
                        th:value="${estado}" th:text="${estado.displayName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
        </div>

        <input type="hidden" th:field="*{vendedorId}">
        <button type="submit" class="btn btn-primary">Guardar Cheque</button>
        <a th:href="@{/cheques/listar}" class="btn btn-secondary ml-2">Cancelar</a>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
