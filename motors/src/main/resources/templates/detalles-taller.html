<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle del Taller</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-xh6r+xRcjXY+1wGmQoA1Fephf7vLJxATuZzWqUj4j6DzQYbAQKxIqX4y38YBZwE9kZgW7EO2bGoSc6GMh6n4sA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: sans-serif; background-color: #eef2f5; padding: 2rem; }
        .card { max-width: 800px; margin: auto; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 2rem; }
        .info { display: flex; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #ddd; }
        .info:last-child { border-bottom: none; }
        .icon { width: 30px; margin-right: 15px; color: #3498db; text-align: center; }
        .label { font-weight: bold; color: #333; width: 200px; }
        .value { color: #555; flex-grow: 1; /* Para que el valor ocupe el espacio */ }
        .buttons { text-align: center; margin-top: 2rem; }
        .btn { display: inline-block; padding: 10px 20px; margin: 0 10px; border-radius: 10px; border: none; cursor: pointer; text-decoration: none; font-size: 1rem; color: white; transition: background-color 0.3s ease; }
        .btn-back { background-color: #7f8c8d; }
        .btn-back:hover { background-color: #636e72; }
        .btn-edit { background-color: #3498db; }
        .btn-edit:hover { background-color: #2980b9; }
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>
<div class="card">
    <h1><i class="fas fa-wrench"></i> Detalles del Taller</h1>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="info"><div class="icon"><i class="fas fa-hashtag"></i></div><div class="label">ID:</div><div class="value" th:text="${taller.id}">ID</div></div>
    <div class="info"><div class="icon"><i class="fas fa-tools"></i></div><div class="label">Nombre del Taller:</div><div class="value" th:text="${taller.nombreTaller}">Nombre Taller</div></div>
    <div class="info"><div class="icon"><i class="fas fa-user"></i></div><div class="label">Nombre:</div><div class="value" th:text="${taller.nombre}">Nombre</div></div>
    <div class="info"><div class="icon"><i class="fas fa-user"></i></div><div class="label">Apellido:</div><div class="value" th:text="${taller.apellido}">Apellido</div></div>
    <div class="info"><div class="icon"><i class="fas fa-map-marker-alt"></i></div><div class="label">Domicilio:</div><div class="value" th:text="${taller.domicilio}">Domicilio</div></div>
    <div class="info"><div class="icon"><i class="fas fa-envelope"></i></div><div class="label">Email:</div><div class="value" th:text="${taller.email}">Email</div></div>
    <div class="info"><div class="icon"><i class="fas fa-phone"></i></div><div class="label">Teléfono:</div><div class="value" th:text="${taller.telefono}">Teléfono</div></div>
    <div class="info"><div class="icon"><i class="fas fa-university"></i></div><div class="label">Banco:</div><div class="value" th:text="${taller.banco ?: '-'}">Banco</div></div> <div class="info"><div class="icon"><i class="fas fa-align-left"></i></div><div class="label">Descripción:</div><div class="value" th:text="${taller.descripcion ?: '-'}">Descripción</div></div>

    <div class="buttons">
        <a class="btn btn-back" th:href="@{/talleres}"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-edit" th:href="@{'/talleres/editar/' + ${taller.id}}"><i class="fas fa-pen"></i> Editar</a>
    </div>
</div>
<script>
    // Script para ocultar mensajes flash
    window.addEventListener('DOMContentLoaded', () => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            if (alert) {
                setTimeout(() => {
                    alert.style.transition = "opacity 0.5s ease";
                    alert.style.opacity = 0;
                    setTimeout(() => alert.remove(), 500);
                }, 4000);
            }
        });
    });
</script>
</body>
</html>
