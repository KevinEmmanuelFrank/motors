<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Auto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
        }

        .submit-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .submit-btn:hover {
            background-color: #1a242f;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Crear Auto</h1>
    <form th:action="@{/autos/crear}" th:object="${auto}" method="post">
        <label>Marca:</label>
        <input type="text" th:field="*{marca}" required/>

        <label>Modelo:</label>
        <input type="text" th:field="*{modelo}" required/>

        <label>Año:</label>
        <input type="text" th:field="*{anio}"/>

        <label>Color:</label>
        <input type="text" th:field="*{color}" required/>

        <label>Cédula:</label>
        <input type="text" th:field="*{cedula}" required/>

        <label>Kilómetros:</label>
        <input type="text" th:field="*{kilometros}" required/>

        <label>Descripción:</label>
        <textarea th:field="*{descripcion}"></textarea>

        <label>Precio Entrada:</label>
        <input type="number" step="0.01" th:field="*{precioEntrada}"/>

        <label>Precio Entrada con Gastos:</label>
        <input type="number" step="0.01" th:field="*{precioEntradaConGastos}"/>

        <label>Precio Salida:</label>
        <input type="number" step="0.01" th:field="*{precioSalida}"/>

        <label>Transmisión:</label>
        <select th:field="*{transmision}">
            <option value="AUTOMATICA">Automática</option>
            <option value="SEMIAUTOMATICA">Semiautomática</option>
            <option value="MANUAL">Manual</option>
        </select>

        <label>Puertas:</label>
        <select th:field="*{puertas}">
            <option value="DOS">2</option>
            <option value="TRES">3</option>
            <option value="CUATRO">4</option>
            <option value="CINCO">5</option>
        </select>

        <label>Combustible:</label>
        <select th:field="*{combustible}">
            <option value="GASOLINA">Gasolina</option>
            <option value="DIESEL">Diésel</option>
            <option value="ELECTRICO">Eléctrico</option>
            <option value="HIBRIDO">Híbrido</option>
        </select>

        <label>¿En venta?</label>
        <select th:field="*{enVenta}">
            <option value="true">Sí</option>
            <option value="false">No</option>
        </select>

        <label>¿0 Km?</label>
        <select th:field="*{oKm}">
            <option value="true">Sí</option>
            <option value="false">No</option>
        </select>

        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button class="submit-btn" type="submit">Crear Auto</button>
            <a href="/autos" class="submit-btn" style="
        background-color: #e74c3c;
        text-align: center;
        display: inline-block;
        padding: 0.75rem;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
        color: white;
        text-decoration: none;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        border: none;
    ">Cancelar</a>
        </div>

    </form>
</div>
</body>
</html>
